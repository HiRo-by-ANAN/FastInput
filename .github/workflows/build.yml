name: Build FastInput

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on macOS
        run: cargo test
      - name: Build universal macOS archive
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FastInput-macos-universal
          path: dist/FastInput-macos-universal.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64 archive
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build MSI (WiX Toolset 5, free)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          ./packaging/windows/generate-third-party-notices.ps1
          ./packaging/windows/build-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FastInput-windows-msi
          path: dist/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FastInput-windows-x64
          path: dist/FastInput-windows-x64.zip
          if-no-files-found: error
