[package]
name = "fastinput"
version = "0.1.0"
edition = "2021"
description = "LAN text pad shared between a computer and a paired phone"
license = "GPL-3.0-or-later"

[dependencies]
if-addrs = "0.15.0"
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
