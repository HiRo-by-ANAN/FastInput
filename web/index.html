<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title data-i18n="page.fastinput.type.on.your.phone.see.it.on.your"></title>
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <style>
:root {
  color-scheme: light dark;
  --page: #f3f5f1;
  --surface: #ffffff;
  --surface-soft: #f7f9f6;
  --surface-deep: #edf4ee;
  --ink: #18362f;
  --ink-soft: #46645c;
  --muted: #758a80;
  --line: #dce7dd;
  --accent: #167d69;
  --accent-dark: #0d624f;
  --accent-soft: #e0f3e9;
  --warm: #fff1df;
  --warm-ink: #895a22;
  --danger: #a44b43;
  --shadow: 0 18px 60px rgba(26, 65, 43, .07), 0 2px 8px rgba(26, 65, 43, .025);
  --radius: 24px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
html { min-width: 280px; scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 280px;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--ink);
  background:
    radial-gradient(ellipse 55% 38% at 0% 0%, rgba(197, 232, 205, .7), transparent 74%),
    radial-gradient(ellipse 43% 36% at 100% 2%, rgba(255, 230, 195, .65), transparent 74%),
    var(--page);
}
button, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .42; }
a { color: inherit; }
[hidden] { display: none !important; }

.app-shell {
  width: min(100%, 1560px);
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 72px);
  display: flex;
  flex-direction: column;
}
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 30px 0 24px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 1.28rem;
  font-weight: 800;
  letter-spacing: -.055em;
  white-space: nowrap;
}
.brand-accent { color: var(--accent); }
.brand-mark {
  display: flex;
  width: 38px;
  height: 38px;
  border-radius: 13px;
  align-items: flex-end;
  justify-content: center;
  gap: 3px;
  padding-bottom: 10px;
  background: var(--ink);
  box-shadow: 0 7px 16px rgba(18, 84, 62, .15);
  transform: rotate(-5deg);
}
.brand-mark span { width: 5px; border-radius: 4px; background: #ecffe5; }
.brand-mark span:nth-child(1) { height: 12px; }
.brand-mark span:nth-child(2) { height: 18px; }
.brand-mark span:nth-child(3) { height: 9px; }
.connection-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 7px 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.73);
  color: var(--ink-soft);
  font-size: .79rem;
  font-weight: 700;
  white-space: nowrap;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #b5c5bb; }
.connection-badge.is-online .status-dot { background: #42ad7b; box-shadow: 0 0 0 4px rgba(66, 173, 123, .13); }
.connection-badge.is-offline .status-dot { background: #d9945d; box-shadow: 0 0 0 4px rgba(217, 148, 93, .12); }
.sidebar-toggle { border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px; background: var(--surface); color: var(--ink-soft); font-size: .79rem; font-weight: 700; white-space: nowrap; }
.sidebar-toggle:hover { background: var(--surface-deep); }

.main-content { flex: 1; }
.intro { margin: clamp(24px, 4.3vw, 68px) 0 34px; }
.eyebrow, .section-kicker, .state-eyebrow {
  margin: 0;
  color: var(--accent);
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .16em;
}
.eyebrow { display: flex; align-items: center; gap: 10px; }
.eyebrow-line { width: 26px; height: 2px; border-radius: 2px; background: var(--accent); }
h1, h2, p { margin-top: 0; }
h1 {
  margin: 17px 0 15px;
  font-size: clamp(2.75rem, 4.8vw, 5.1rem);
  font-weight: 850;
  letter-spacing: -.072em;
  line-height: 1.14;
}
h1 br { display: none; }
h1 span { color: var(--accent); }
h1 .hero-prefix { color: inherit; }
.intro > p {
  max-width: 700px;
  margin-bottom: 0;
  color: var(--ink-soft);
  font-size: clamp(.98rem, 1.2vw, 1.1rem);
  line-height: 1.8;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(310px, 380px);
  align-items: start;
  gap: clamp(22px, 2.5vw, 36px);
}
.editor-card, .side-card, .state-card {
  border: 1px solid rgba(190, 209, 195, .72);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.editor-card { min-width: 0; overflow: hidden; }
.editor-heading-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 26px 30px 21px;
}
.editor-heading-row h2 { margin: 6px 0 0; font-size: clamp(1.35rem, 2vw, 1.75rem); letter-spacing: -.045em; }
.save-status {
  flex: none;
  border-radius: 100px;
  padding: 7px 10px;
  background: var(--accent-soft);
  color: var(--accent-dark);
  font-size: .75rem;
  font-weight: 800;
  white-space: nowrap;
}
.save-status.is-saving { background: var(--surface-deep); color: var(--ink-soft); }
.save-status.is-warning { background: var(--warm); color: var(--warm-ink); }
.conflict-notice {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin: 0 20px 16px;
  padding: 17px 18px;
  border: 1px solid #e6d1a9;
  border-radius: 15px;
  background: var(--warm);
  color: var(--warm-ink);
}
.conflict-copy strong { display: block; margin-bottom: 4px; font-size: .94rem; }
.conflict-copy p { margin: 0; font-size: .81rem; line-height: 1.55; }
.conflict-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 39px;
  padding: 9px 14px;
  border: 1px solid transparent;
  border-radius: 11px;
  font-size: .82rem;
  font-weight: 750;
  line-height: 1.35;
  white-space: nowrap;
  transition: transform .16s ease, background .16s ease, border-color .16s ease;
}
.button:not(:disabled):active, .tool-button:not(:disabled):active { transform: scale(.97); }
.button-primary { background: var(--accent); color: #fff; }
.button-primary:hover:not(:disabled) { background: var(--accent-dark); }
.button-secondary { border-color: var(--line); background: var(--surface); color: var(--ink); }
.button-secondary:hover:not(:disabled) { background: var(--surface-soft); }
.button-danger { background: #fff1ec; color: var(--danger); }
.button-danger:hover:not(:disabled) { background: #ffe9e1; }
.editor-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 20px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--surface-soft);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.editor-tools::-webkit-scrollbar { display: none; }
.history-actions, .utility-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.copy-text-mobile { display: none; }
.tool-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 37px;
  padding: 6px 11px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink-soft);
  font-size: .82rem;
  font-weight: 700;
  white-space: nowrap;
  transition: transform .16s ease, background .16s ease;
}
.tool-button:hover:not(:disabled) { background: var(--surface-deep); }
.tool-button-danger:hover:not(:disabled) { background: #ffeee9; color: var(--danger); }
.tool-icon { font-size: 1.45rem; line-height: .8; font-weight: 400; }
.editor {
  display: block;
  width: 100%;
  min-height: clamp(440px, 57vh, 820px);
  padding: 29px 31px;
  border: 0;
  outline: 0;
  resize: vertical;
  background: var(--surface);
  color: var(--ink);
  font-size: clamp(1.04rem, 1.15vw, 1.14rem);
  font-weight: 450;
  line-height: 1.85;
  letter-spacing: .008em;
  overflow-wrap: anywhere;
  tab-size: 4;
}
.editor::placeholder { color: #9aaba1; opacity: 1; }
.editor:focus-visible { box-shadow: inset 0 0 0 2px rgba(22,125,105,.35); }
.editor-footer {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 30px 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: .76rem;
  font-weight: 600;
}

/* Voice input guidance */
.voice-hint {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--accent-soft);
  color: var(--ink);
}
.voice-hint-icon { font-size: 1.25rem; line-height: 1.4; }
.voice-hint-text { flex: 1; margin: 0; font-size: .82rem; line-height: 1.6; white-space: pre-line; }
.voice-hint-close { flex: none; align-self: center; }

/* Prominent Microphone Tool Button */
.tool-button-mic {
  background: var(--accent-soft);
  color: var(--accent-dark);
  font-weight: 750;
  border: 1px solid rgba(22, 125, 105, .25);
  padding: 6px 12px;
}
.tool-button-mic:hover:not(:disabled) {
  background: #d0f0de;
  border-color: var(--accent);
}
.tool-button-mic.is-listening {
  background: #fee2e2 !important;
  border-color: #ef4444 !important;
  color: #b91c1c !important;
  animation: micPulse 1.5s infinite;
}
@keyframes micPulse {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
  70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}

.pair-collapsed-box {
  padding: 24px 16px;
  text-align: center;
  background: var(--surface-soft);
  border: 1px dashed var(--line);
  border-radius: 16px;
  margin: 14px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.pair-collapsed-icon {
  font-size: 2.2rem;
  line-height: 1;
}
.pair-collapsed-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--ink-soft);
}

.desktop-panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.side-card { padding: 24px; }
.side-heading { display: flex; align-items: center; gap: 13px; }
.side-heading h2 { margin: 5px 0 0; font-size: 1.15rem; letter-spacing: -.035em; }
.step-badge, .device-icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: .8rem;
  font-weight: 800;
}
.step-badge-warm { background: #fff0dc; color: #ab7232; }
.device-icon { font-size: 1.05rem; }
.side-description { margin: 16px 0 19px; color: var(--ink-soft); font-size: .85rem; line-height: 1.7; }
.qr-wrap {
  display: grid;
  place-items: center;
  width: min(100%, 252px);
  min-height: 222px;
  margin: 0 auto 16px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #fff;
}
.qr-wrap img { display: block; width: 100%; height: auto; max-height: 226px; object-fit: contain; }
.qr-unavailable { padding: 25px; color: var(--muted); font-size: .83rem; text-align: center; }
.pair-url {
  display: block;
  max-width: 100%;
  padding: 11px 13px;
  border-radius: 10px;
  background: var(--surface-soft);
  color: var(--accent-dark);
  font-size: .77rem;
  line-height: 1.5;
  text-align: center;
  text-decoration: none;
  overflow-wrap: anywhere;
}
.pair-url:hover { text-decoration: underline; }
.pair-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.muted-small { color: var(--muted); font-size: .74rem; }
.text-button { padding: 4px 0; border: 0; background: none; color: var(--accent); font-size: .77rem; font-weight: 800; white-space: nowrap; }
.text-button:hover:not(:disabled) { text-decoration: underline; }
.count-pill { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 3px; padding: 0 5px; border-radius: 8px; background: var(--surface-deep); color: var(--ink-soft); font-size: .68rem; vertical-align: 2px; }
.item-list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.item-card { display: flex; justify-content: space-between; gap: 10px; padding: 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-soft); }
.item-info { min-width: 0; }
.item-title { display: block; color: var(--ink); font-size: .84rem; font-weight: 750; overflow-wrap: anywhere; }
.item-detail { display: block; margin-top: 4px; color: var(--muted); font-size: .74rem; line-height: 1.5; overflow-wrap: anywhere; }
.item-code { display: inline-block; margin-top: 8px; padding: 5px 8px; border-radius: 7px; background: var(--warm); color: var(--warm-ink); font-size: .95rem; font-weight: 850; letter-spacing: .13em; font-variant-numeric: tabular-nums; }
.item-actions { display: flex; flex: none; flex-direction: column; align-items: stretch; justify-content: center; gap: 6px; }
.item-actions .button { min-height: 30px; padding: 5px 9px; font-size: .73rem; }
.empty-note { margin: 16px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.6; }
.desktop-exit { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 5px 6px 2px; }
.desktop-exit p { margin: 0; color: var(--muted); font-size: .73rem; line-height: 1.55; }
.exit-button { flex: none; color: var(--muted); }
.exit-button:hover:not(:disabled) { color: var(--danger); }

.state-card { width: min(100%, 640px); margin: 0 auto; padding: clamp(32px, 6vw, 58px); text-align: center; }
.state-card h2 { margin: 12px 0 9px; font-size: clamp(1.3rem, 3vw, 1.8rem); letter-spacing: -.04em; }
.state-card p:not(.state-eyebrow) { margin: 0 auto; max-width: 400px; color: var(--ink-soft); font-size: .9rem; line-height: 1.75; }
.state-card .button { margin-top: 23px; }
.loading-orbit { width: 42px; height: 42px; margin: 0 auto 20px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: orbit 1s linear infinite; }
.waiting-icon { display: grid; place-items: center; width: 55px; height: 55px; margin: 0 auto 20px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); font-size: 2rem; }
.pair-code { display: inline-block; margin-top: 21px; padding: 12px 19px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-soft); color: var(--ink); font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 850; letter-spacing: .22em; font-variant-numeric: tabular-nums; }
@keyframes orbit { to { transform: rotate(360deg); } }

/* PIN Card on Desktop */
.pin-card-display {
  margin: 0 0 14px;
  padding: 13px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface-soft);
  text-align: center;
}
.pin-display-title {
  color: var(--muted);
  font-size: .74rem;
  font-weight: 700;
  letter-spacing: .05em;
  margin-bottom: 5px;
}
.pin-digits-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.pin-digits {
  font-size: 1.7rem;
  font-weight: 850;
  letter-spacing: .18em;
  font-variant-numeric: tabular-nums;
  color: var(--accent-dark);
}

/* PIN Entry on Unpaired Screen */
.pin-section {
  width: 100%;
  max-width: 380px;
  margin: 22px auto 8px;
}
.pin-box {
  padding: 18px 20px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface-soft);
  text-align: left;
}
.pin-label {
  display: block;
  font-size: .84rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 12px;
  text-align: center;
}
.pin-input-group {
  display: flex;
  gap: 8px;
}
.pin-input {
  flex: 1;
  min-width: 0;
  min-height: 42px;
  padding: 6px 10px;
  border: 1.5px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
  color: var(--ink);
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-align: center;
  font-variant-numeric: tabular-nums;
  outline: none;
  transition: border-color .15s ease;
}
.pin-input:focus {
  border-color: var(--accent);
}
.pin-error-text {
  margin: 10px 0 0;
  font-size: .78rem;
  color: var(--danger);
  font-weight: 700;
  text-align: center;
}
.pin-alternative-hint {
  margin: 12px 0 0;
  font-size: .78rem;
  color: var(--muted);
  line-height: 1.5;
  text-align: center;
}

.site-footer { display: flex; justify-content: space-between; gap: 20px; padding: 29px 0 22px; color: var(--muted); font-size: .73rem; }
.site-footer span:first-child { color: var(--ink-soft); font-weight: 800; }
.toast { position: fixed; z-index: 20; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); max-width: min(380px, calc(100vw - 40px)); padding: 12px 16px; border-radius: 12px; background: var(--ink); color: #fff; box-shadow: 0 12px 34px rgba(0,0,0,.19); font-size: .83rem; font-weight: 700; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid rgba(22, 125, 105, .5); outline-offset: 3px; }

body[data-role="phone"] .desktop-panel { display: none; }
body[data-role="phone"] .sidebar-toggle { display: none; }
body[data-role="phone"] .workspace { grid-template-columns: minmax(0, 1fr); max-width: 860px; margin: 0 auto; }
.workspace.sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }
body[data-role="phone"] .intro { max-width: 860px; margin-left: auto; margin-right: auto; }

@media (max-width: 1000px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .desktop-panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .pair-card { grid-row: span 2; }
  .editor { min-height: 48vh; }
}
@media (max-width: 680px) {
  .app-shell { padding: 0 15px; }
  .site-header { padding: 18px 3px 8px; }
  .brand { font-size: 1.13rem; }
  .brand-mark { width: 34px; height: 34px; border-radius: 11px; }
  .connection-badge { min-height: 30px; padding: 5px 9px; font-size: .69rem; }
  .intro { margin: 30px 4px 25px; }
  .eyebrow { font-size: .65rem; }
  h1 { margin: 14px 0 12px; font-size: clamp(2.3rem, 9vw, 3.55rem); }
  h1 br { display: initial; }
  .intro > p { font-size: .87rem; line-height: 1.65; }
  .workspace { gap: 17px; }
  .editor-card, .side-card, .state-card { border-radius: 19px; }
  .editor-heading-row { padding: 21px 19px 18px; }
  .editor-heading-row h2 { font-size: 1.34rem; }
  .save-status { padding: 6px 8px; font-size: .69rem; }
  .editor-tools { padding: 7px 8px; gap: 4px; }
  .tool-button { padding: 6px 7px; font-size: .78rem; gap: 3px; }
  .tool-icon { font-size: 1.25rem; }
  .history-actions .tool-label { display: none; }
  .copy-text-desktop { display: none; }
  .copy-text-mobile { display: inline; }
  .editor { min-height: max(43svh, 300px); padding: 22px 20px; font-size: 1rem; line-height: 1.8; }
  .editor-footer { padding: 12px 19px 15px; font-size: .69rem; }
  .editor-tip { text-align: right; }
  .desktop-panel { display: flex; }
  .desktop-exit { align-items: flex-start; }
  .side-card { padding: 20px; }
  .conflict-notice { display: block; margin: 0 12px 12px; padding: 14px; }
  .conflict-actions { justify-content: flex-start; margin-top: 12px; }
  .site-footer { padding: 25px 4px 20px; }
}
@media (max-width: 370px) {
  .brand { gap: 8px; font-size: 1.05rem; }
  .tool-button { padding: 6px; }
  .tool-button .tool-icon + span { display: none; }
  .tool-button-mic span { display: inline-block !important; }
  .editor-tip { display: none; }
  .conflict-actions .button { flex: 1; white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
